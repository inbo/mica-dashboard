name: Build and deploy on UAT (AWS ECS)
on:
  push:
    branches: [ main, feat/ecs-container ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-ecs-uat
  cancel-in-progress: false

jobs:
  build:
    name: Build image
    # The ECS tasks run on ARM64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ASSUME_ROLE_ARN_ECR }}
          role-session-name: github-action-${{ github.run_id }}-build
          aws-region: eu-west-1
      - id: ecr-login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/inbo-mica-backend:${{ github.sha }}
          # A plain image manifest instead of an index with attestations, so the deploy can retag it
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy on UAT
    needs: build
    uses: ./.github/workflows/deploy_ecs.yml
    with:
      environment: uat
      image-tag: ${{ github.sha }}
    secrets: inherit
